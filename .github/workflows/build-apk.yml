name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: coalgov-mobile/package-lock.json

      - name: Install Dependencies
        working-directory: coalgov-mobile
        run: npm ci

      - name: Build Web Assets
        working-directory: coalgov-mobile
        run: npm run build

      - name: Sync with Capacitor Android
        working-directory: coalgov-mobile
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: coalgov-mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coalgov-ai-debug-apk
          path: coalgov-mobile/android/app/build/outputs/apk/debug/app-debug.apk
